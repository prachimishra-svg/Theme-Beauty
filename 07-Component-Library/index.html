<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUDGE Component Library v1</title>
<!-- Local, offline component library. Everything shown here is rendered from the real components in 03-Wireframes/00-Shared-Tailwind-Foundation/partials/components
     and styled by the Design Variables. library.data.js is generated by build-library.ps1. No server and no extra dependencies: open this file in a browser. -->
<link rel="stylesheet" href="../02-Design-Variables/Styles/variables.css">
<link rel="stylesheet" href="library.css">
</head>
<body>
<header class="top">
  <div class="brand"><strong>NUDGE</strong> Component Library <span class="ver">v1</span></div>
  <input id="search" type="search" placeholder="Search components (name, group, page)" aria-label="Search components">
  <div class="top-meta" id="meta"></div>
</header>
<main class="app">
  <div class="side">
    <div class="modes" id="modes" role="group" aria-label="Library view">
      <button data-m="master" aria-pressed="false">Master library</button>
      <button data-m="pages" aria-pressed="false">Page-wise</button>
      <button data-m="components" aria-pressed="true">Components</button>
    </div>
    <nav class="tree" id="tree" aria-label="Components"></nav>
  </div>
  <section class="stage">
    <div class="stage-head">
      <div>
        <h1 id="cName">Select a component</h1>
        <p id="cSummary" class="sum"></p>
        <p id="cMeta" class="meta"></p>
      </div>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="preview" aria-selected="true">Preview</button>
      <button role="tab" data-tab="variants">Variants</button>
      <button role="tab" data-tab="hierarchy">Hierarchy</button>
      <button role="tab" data-tab="reuse">Reuse</button>
      <button role="tab" data-tab="tokens">Tokens</button>
      <button role="tab" data-tab="instances">Instances</button>
      <button role="tab" data-tab="docs">Docs</button>
    </div>
    <div class="bar" id="bar">
      <span class="lbl">Width</span>
      <div class="seg" id="widths"></div>
      <label class="lbl">Background
        <select id="bg"><option value="bg-page">Page</option><option value="bg-surface">Surface</option><option value="bg-subtle">Subtle</option><option value="bg-inverse">Inverse</option></select>
      </label>
      <label class="lbl" title="The Homepage page layer adds its own button, icon (24 px) and heading rules, as on the real Homepage">Style layer
        <select id="ctx"><option value="shared">Shared Design System</option><option value="homepage">Homepage page layer</option></select>
      </label>
      <label class="lbl" id="exWrap">Real call site
        <select id="examples"></select>
      </label>
      <span id="status" class="status" role="status"></span>
    </div>
    <div class="canvas" id="canvas">
      <div class="frame-wrap" id="frameWrap"><iframe id="frame" title="Component preview"></iframe></div>
      <div class="panel" id="panel" hidden></div>
    </div>
  </section>
  <aside class="props" id="props" aria-label="Properties"></aside>
</main>
<script src="library.data.js"></script>
<script src="audit.data.js"></script>
<script src="sync-status.data.js"></script>
<script src="engine.js"></script>
<script>window.tailwind = {};</script>
<script src="../03-Wireframes/00-Shared-Tailwind-Foundation/tailwind.config.js"></script>
<script src="library.js"></script>
</body>
</html>
