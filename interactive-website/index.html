 body{margin:0;font:16px/1.5 var(--font-body,system-ui,sans-serif);background:var(--color-bg-page);color:var(--color-text-primary);display:grid;place-items:center;min-height:100vh;padding:24px}

<main>
 <h1>NUDGE interactive prototype</h1>
 <p>This opens the existing wireframes with links, search, cart and quantity changes working across pages. Checkout, accounts, payments and wishlist are not simulated.</p>
