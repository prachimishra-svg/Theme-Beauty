{{each groups}}<details class="accordion-item" data-g="{{item.key}}"{{if item.open}} open{{/if}}><summary class="accordion-summary text-body-sm font-semibold uppercase tracking-uppercase"><span>{{item.title}}<span class="ml-2 inline-block font-semibold text-brand" data-n="{{item.key}}"></span></span>@@PARTIAL components/base/icon name=chevron-down size=custom@@</summary><div class="accordion-panel max-w-none pb-4">{{if item.kind=options}}<fieldset class="m-0 flex min-w-0 flex-col border-0 p-0"><legend class="sr-only">{{item.title}}</legend>{{each item.options}}<label class="choice group"><input class="choice-input" type="checkbox" name="{{item.name}}" value="{{item.value}}"><span class="flex flex-1 justify-between gap-2 text-ink-secondary group-has-[:checked]:font-medium group-has-[:checked]:text-brand-active"><span>{{item.label}}</span><span class="type-caption">{{item.count}}</span></span></label>{{/each}}</fieldset>{{/if}}{{if item.kind=swatches}}<div class="flex flex-wrap gap-1 pb-1" role="group" aria-label="Shade">{{each item.options}}<label class="swatch"><input class="swatch-input" type="checkbox" name="shade" value="{{item.value}}"><span class="swatch-chip" style="--swatch: {{item.hex}}"></span><span class="sr-only">{{item.name}} ({{item.count}})</span></label>{{/each}}</div>{{/if}}{{if item.kind=price}}<div class="grid grid-cols-2 gap-3"><div class="field"><label class="field-label" for="f-min">Minimum ($)</label><input class="input" id="f-min" name="min" type="number" inputmode="numeric" min="0" placeholder="0"></div><div class="field"><label class="field-label" for="f-max">Maximum ($)</label><input class="input" id="f-max" name="max" type="number" inputmode="numeric" min="0" placeholder="40"></div></div>{{/if}}</div></details>{{/each}}
