<div class="mb-2 lg:mb-0">
<p class="pb-1 pt-3 text-overline font-medium uppercase tracking-uppercase text-ink-muted lg:pb-3 lg:pt-0">{{title}}</p>
<ul class="m-0 list-none p-0">
{{each links}}<li><a href="#collection-{{key}}-{{slug:item}}" class="flex min-h-touch items-center text-body text-ink no-underline hover:text-brand hover:underline lg:min-h-0 lg:py-2">{{item}}</a></li>{{/each}}</ul></div>
